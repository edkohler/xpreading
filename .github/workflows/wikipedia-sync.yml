# Biweekly (every 14 days) check of the award categories' Wikipedia pages for new books.
# Runs the management command on a temporary Fly machine built from the
# latest deployed image (same secrets as the app), which is destroyed after.
# New findings land in Django admin > Pages > Pending awards for review.
name: Wikipedia award sync

on:
  schedule:
    - cron: "17 11 * * 1" # Mondays ~5-6am Central; gate below makes it every 14 days
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --dry-run or --page Newbery_Medal --force"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency: wikipedia-sync
    timeout-minutes: 60
    steps:
      - name: Skip alternate weeks (runs every 14 days)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          # Weeks since the Unix epoch; run only on even weeks.
          if [ $(( $(date -u +%s) / 604800 % 2 )) -ne 0 ]; then
            echo "Off week - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.skip != 'true'
      - if: steps.gate.outputs.skip != 'true'
        run: flyctl console -a katyreads -C "python /code/manage.py sync_wikipedia_awards $SYNC_ARGS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SYNC_ARGS: ${{ github.event.inputs.args }}
