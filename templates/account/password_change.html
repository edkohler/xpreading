{% extends "account/base_manage_password.html" %}
{% load crispy_forms_tags %}

{% block head_title %}Change password{% endblock head_title %}

{% block content %}
<h1 class="h3 mb-3">Change password</h1>
<div class="card"><div class="card-body">
  <form method="post" action="{% url 'account_change_password' %}">
    {% csrf_token %}
    {{ form|crispy }}
    {{ redirect_field }}
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <button class="btn btn-primary" type="submit">Change password</button>
      <a href="{% url 'account_reset_password' %}" class="small">Forgot your current password?</a>
    </div>
  </form>
</div></div>
{% endblock content %}
