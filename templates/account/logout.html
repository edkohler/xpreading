{% extends "account/base_entrance.html" %}

{% block head_title %}Sign out{% endblock head_title %}

{% block content %}
<div class="text-center">
  <h1 class="h3 mb-2">Ready to head out?</h1>
  <p class="text-body-secondary mb-4">Your reading progress is saved. See you next time!</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {{ redirect_field }}
    <div class="d-grid gap-2">
      <button class="btn btn-primary btn-lg" type="submit">Sign out</button>
      <a class="btn btn-outline-secondary" href="{% url 'my_books' %}">Stay logged in</a>
    </div>
  </form>
</div>
{% endblock content %}
