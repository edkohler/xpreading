{% load allauth %}
<section class="card border-3 rounded-4 mb-4">
    <div class="card-header fw-semibold">
        {% slot title %}
        {% endslot %}
    </div>
    <div class="card-body">
        {% slot body %}
        {% endslot %}
        {% if slots.actions %}
        <div class="d-flex flex-wrap gap-2 mt-3">
            {% for action in slots.actions %}{{ action }}{% endfor %}
        </div>
        {% endif %}
    </div>
</section>
