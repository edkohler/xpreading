<style>
  /* Shared book flexbox (category detail, book detail "More by author").
     --book-count is set on .book-flex in the template; one row holds that many
     books, capped per breakpoint, and extra books wrap onto new rows. */
  .book-flex {
    --book-gap: 1rem;
    --books-per-row: min(var(--book-count, 2), 2);
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem var(--book-gap);
  }
  @media (min-width: 576px) {
    .book-flex { --books-per-row: min(var(--book-count, 3), 3); }
  }
  @media (min-width: 768px) {
    .book-flex { --books-per-row: min(var(--book-count, 4), 4); }
  }
  @media (min-width: 992px) {
    .book-flex { --books-per-row: min(var(--book-count, 6), 6); }
  }
  .book-flex-item {
    flex: 0 0 calc((100% - (var(--books-per-row) - 1) * var(--book-gap)) / var(--books-per-row));
    max-width: 220px; /* keeps one- or two-book years from getting huge covers */
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .book-flex-cover img {
    display: block;
    width: 100%;
    max-width: 220px;
    max-height: 330px;
    aspect-ratio: 2 / 3;
    object-fit: contain;
    background-color: var(--bs-tertiary-bg);
    border: 3px solid var(--xp-ink, #1e1b3a);
    border-radius: 0.75rem !important;
    box-shadow: 0 5px 0 var(--xp-ink, #1e1b3a);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .book-flex-cover:hover img {
    transform: translateY(-3px);
    box-shadow: 0 8px 0 var(--xp-ink, #1e1b3a);
  }
  .book-flex-title {
    font-family: "Nunito", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .book-flex-title a {
    color: var(--bs-body-color);
    text-decoration: none;
  }
  .book-flex-title a:hover {
    text-decoration: underline;
  }
  .book-flex-body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .book-flex-action {
    margin-top: auto;
    width: 100%;
  }
  .book-flex-action .btn {
    --bs-btn-padding-y: .25rem;
    --bs-btn-padding-x: .5rem;
    --bs-btn-font-size: .875rem;
    width: 100%;
  }
</style>
