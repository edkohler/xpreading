{% if user.is_authenticated %}
    {% if completed %}
        <button
            hx-post="{% url 'mark_book_unread' book.id %}"
            hx-target="this"
            hx-swap="outerHTML"
            class="btn btn-success"
            title="Remove this book from your completed list"
        >
            <span aria-hidden="true">&#10003;</span> Read <span class="visually-hidden">(click to mark as unread)</span>
        </button>
    {% else %}
        <button
            hx-post="{% url 'mark_book_read' book.id %}"
            hx-target="this"
            hx-swap="outerHTML"
            class="btn btn-outline-primary bg-white"
            title="Add this book to your completed list"
        >
            Mark as read
        </button>
    {% endif %}
{% else %}
    <a
        href="{% url 'account_login' %}?next={{ request.get_full_path|urlencode }}"
        class="btn btn-outline-secondary bg-white"
        title="Log in to track your reading progress"
    >
        Log in to track
    </a>
{% endif %}
