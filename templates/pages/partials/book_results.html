<div class="search-results mt-4">
    {% if results %}
        {% for result in results %}
        <div class="result-item border p-3 mb-3 bg-body rounded shadow-sm">
            <div class="d-flex align-items-center gap-3">
                {% if result.image %}
                <div class="flex-shrink-0">
                    <img src="{{ result.image }}" alt="{{ result.title }}" class="img-fluid" style="width: 6rem;">
                </div>
                {% endif %}
                <div class="flex-grow-1">
                    <h4 class="fs-5 fw-semibold mb-2">{{ result.title }}</h4>
                    <p class="text-body-secondary mb-2">ASIN: <a href="https://www.amazon.com/dp/{{ result.asin }}" target="_blank">{{ result.asin }}</a></p>
                    <button class="btn btn-primary"
                            hx-post="{% url 'update_book_from_api' book_id %}"
                            hx-vals='{"asin": "{{ result.asin }}", "image": "{{ result.image }}"}'
                            hx-target="closest tr"
                            hx-swap="outerHTML">
                        Use This Result
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p class="text-body-secondary">No results found.</p>
    {% endif %}
</div>
