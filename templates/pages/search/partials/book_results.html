<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mb-3">
    {% for book in books %}
        <div class="col">
            <div class="book-card card border-3 p-3 h-100 d-flex flex-row gap-3 align-items-start">
                {% if book.image %}
                    <a href="{% url 'book_detail' book.slug %}" tabindex="-1" aria-hidden="true"><img src="{{ book.image.url }}" alt="" class="xp-cover-thumb" style="width: 4.5rem; height: 6.75rem;" loading="lazy"></a>
                {% endif %}
                <div class="min-w-0">
                    <h3 class="h6 fs-5 fw-bold mb-1"><a href="{% url 'book_detail' book.slug %}" class="link-dark link-underline-opacity-0 link-underline-opacity-100-hover">{{ book.title }}</a></h3>
                    <p class="fw-bold text-body-secondary mb-1">by {{ book.author }}</p>
                    {% if book.illustrator %}
                    <p class="small text-body-secondary mb-0">Illustrated by {{ book.illustrator }}</p>
                    {% endif %}
                </div>
            </div>
        </div>
    {% endfor %}
</div>

{% if books.has_next %}
    <div class="load-more text-center mt-2 mb-4">
        <button
            class="btn btn-primary"
            hx-get="{% url 'search' %}?q={{ query|urlencode }}&page={{ books.next_page_number }}"
            hx-target="closest .load-more"
            hx-swap="outerHTML"
            hx-indicator="closest .load-more"
        >
            Load More Books
        </button>
        <div class="htmx-indicator"><div class="spinner"></div></div>
    </div>
{% endif %}
